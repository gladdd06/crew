<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ЭКИПАЖ · демо продукта</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<meta name="theme-color" content="#1C4FD8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=Montserrat:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --blue:#1C4FD8; --blue-d:#1238A8; --blue-50:#EEF3FF; --blue-100:#DCE6FF;
  --red:#E0393E; --red-50:#FDEEEE;
  --ink:#0E1A33; --ink2:#2B3752; --muted:#5B6479; --faint:#8A93A6;
  --line:#E3E7EF; --soft:#F5F7FB; --bg:#FFFFFF;
  --good:#1F9D6B; --good-50:#E7F6EF; --warn:#C27A06; --warn-50:#FDF4E3;
  --r-lg:24px; --r:18px; --r-sm:12px;
  --h:'Montserrat','Golos Text',system-ui,sans-serif;
  --t:'Golos Text','Segoe UI',system-ui,-apple-system,Arial,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:var(--t);background:var(--bg);color:var(--ink);line-height:1.55;-webkit-font-smoothing:antialiased;font-size:15px}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
.wrap{max-width:1200px;margin:0 auto;padding:0 28px}
@media(max-width:640px){.wrap{padding:0 16px}}
.hidden{display:none!important}
h1,h2,h3,.hf{font-family:var(--h);letter-spacing:-.4px}

/* ---------------- шапка ---------------- */
header.top{position:sticky;top:0;z-index:30;background:rgba(255,255,255,.96);backdrop-filter:blur(6px);border-bottom:1px solid var(--line)}
.top-in{display:flex;align-items:center;gap:22px;height:64px}
.steps-row{border-top:1px solid var(--line)}
.steps-row .wrap{padding-top:8px;padding-bottom:8px}
.brand{display:flex;align-items:center;gap:11px;flex-shrink:0;cursor:pointer}
.logo{width:40px;height:40px;border-radius:12px;background:var(--blue);display:flex;align-items:center;justify-content:center}
.logo svg{width:22px;height:22px}
.wm{font-family:var(--h);font-weight:800;font-size:19px;letter-spacing:2.5px;line-height:1}
.ws{font-size:11.5px;color:var(--muted);margin-top:3px}
.steps{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.steps::-webkit-scrollbar{display:none}
.steps button{display:flex;align-items:center;gap:8px;padding:9px 13px;border-radius:40px;font-size:13.5px;font-weight:600;color:var(--muted);white-space:nowrap;transition:.15s}
.steps button .n{width:24px;height:24px;border-radius:50%;background:var(--soft);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:var(--muted);font-family:var(--h)}
.steps button:hover:not(.on){background:var(--soft);color:var(--ink)}
.steps button.on{background:var(--blue);color:#fff}
.steps button.on .n{background:#fff;color:var(--blue)}
.steps button.done .n{background:var(--blue-100);color:var(--blue)}
.ribbon{height:4px;display:flex}
.ribbon i{flex:1}
.ribbon i:nth-child(1){background:#DCE3EF}.ribbon i:nth-child(2){background:var(--blue)}.ribbon i:nth-child(3){background:var(--red)}


main{padding-top:40px;padding-bottom:90px}
section.view{animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* ---------------- общие элементы ---------------- */
.eyebrow{display:inline-flex;align-items:center;gap:8px;font-size:12.5px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:var(--blue);margin-bottom:12px}
.eyebrow:before{content:"";width:18px;height:3px;border-radius:2px;background:var(--red)}
h2.title{font-size:38px;line-height:1.12;font-weight:800;margin-bottom:14px;max-width:900px}
@media(max-width:640px){h2.title{font-size:28px}}
.lead{font-size:17px;color:var(--ink2);max-width:820px;margin-bottom:30px}
.card{background:#fff;border:1px solid var(--line);border-radius:var(--r-lg);padding:26px}
.card.soft{background:var(--soft);border-color:transparent}
.card.blue{background:var(--blue);border-color:var(--blue);color:#fff}
.h3{font-family:var(--h);font-size:19px;font-weight:700;margin-bottom:12px;letter-spacing:-.3px}
.lab{font-size:12px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--faint);margin-bottom:10px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
@media(max-width:900px){.grid2,.grid3{grid-template-columns:1fr}}
.gap{margin-top:22px}.gap-l{margin-top:44px}
.btn{display:inline-flex;align-items:center;gap:9px;border-radius:40px;padding:14px 26px;font-size:15px;font-weight:600;transition:.15s}
.btn-primary{background:var(--blue);color:#fff}
.btn-primary:hover{background:var(--blue-d)}
.btn-ghost{background:#fff;border:1.5px solid var(--line);color:var(--ink)}
.btn-ghost:hover{border-color:var(--blue);color:var(--blue)}
.btn-sm{padding:9px 16px;font-size:13.5px}
.btn-lg{padding:15px 28px;font-size:16px}
.actions{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-top:36px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;padding:5px 12px;border-radius:30px;background:var(--blue-50);color:var(--blue);white-space:nowrap}
.chip.red{background:var(--red-50);color:var(--red)}
.chip.grey{background:var(--soft);color:var(--muted)}
.ph{width:44px;height:44px;border-radius:50%;object-fit:cover;object-position:center 20%;flex-shrink:0;border:2px solid #fff;box-shadow:0 0 0 1px var(--line)}
.ph.lg{width:72px;height:72px}
.ph.sm{width:30px;height:30px}
.txt p{margin-bottom:10px}.txt p:last-child{margin-bottom:0}
ul.dl{list-style:none;display:flex;flex-direction:column;gap:8px}
ul.dl li{position:relative;padding-left:18px;font-size:14.5px}
ul.dl li:before{content:"";position:absolute;left:3px;top:9px;width:7px;height:7px;border-radius:50%;background:var(--blue)}
.quote{border-left:3px solid var(--blue-100);padding:4px 0 4px 14px;margin-top:10px;font-size:14px;color:var(--ink2)}
.quote .qwho{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted);margin-bottom:3px;font-weight:600}
.quote .ts{font-family:var(--h);font-weight:700;color:var(--blue);font-size:12px}

/* ---------------- старт ---------------- */
.hero{display:grid;grid-template-columns:1.15fr .85fr;gap:36px;align-items:center}
@media(max-width:900px){.hero{grid-template-columns:1fr}}
.hero h1{font-size:50px;line-height:1.06;font-weight:800;margin-bottom:20px}
.hero h1 em{font-style:normal;color:var(--blue)}
@media(max-width:640px){.hero h1{font-size:34px}}
.hero .lead{margin-bottom:26px}
.hero-card{background:var(--blue);color:#fff;border-radius:var(--r-lg);padding:30px;position:relative;overflow:hidden}
.hero-card:after{content:"";position:absolute;right:-60px;bottom:-60px;width:220px;height:220px;border-radius:50%;background:rgba(255,255,255,.07)}
.hero-card .k{font-size:12.5px;letter-spacing:1.2px;text-transform:uppercase;font-weight:700;opacity:.8;margin-bottom:14px}
.hero-card .row{display:flex;gap:14px;align-items:flex-start;padding:12px 0;border-top:1px solid rgba(255,255,255,.18)}
.hero-card .row:first-of-type{border-top:none}
.hero-card .row b{font-family:var(--h);font-size:24px;line-height:1;min-width:54px}
.hero-card .row span{font-size:14px;opacity:.92}
.flow{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;position:relative}
@media(max-width:900px){.flow{grid-template-columns:1fr}}
.fstep{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:20px 18px;cursor:pointer;transition:.15s;text-align:left;position:relative}
.fstep:hover{border-color:var(--blue);box-shadow:0 6px 24px rgba(28,79,216,.08);transform:translateY(-2px)}
.fstep .ic{width:44px;height:44px;border-radius:14px;background:var(--blue-50);display:flex;align-items:center;justify-content:center;margin-bottom:14px}
.fstep .ic svg{width:22px;height:22px;stroke:var(--blue);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.fstep .no{position:absolute;top:18px;right:18px;font-family:var(--h);font-weight:800;font-size:28px;color:var(--blue-50)}
.fstep .t{font-family:var(--h);font-weight:700;font-size:15.5px;line-height:1.25;margin-bottom:6px}
.fstep .d{font-size:13.3px;color:var(--muted);line-height:1.45}
.team-strip{display:flex;gap:18px;flex-wrap:wrap}
.tm{display:flex;align-items:center;gap:11px}
.tm .n{font-weight:600;font-size:14px}.tm .s{font-size:12.5px;color:var(--muted)}
.outcomes{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
@media(max-width:900px){.outcomes{grid-template-columns:1fr}}
.outcomes{align-content:start}
@media(max-width:700px){#tagline{display:none}}
.oc{background:var(--soft);border-radius:var(--r);padding:20px}
.oc .t{font-family:var(--h);font-weight:700;font-size:15.5px;margin-bottom:6px}
.oc .d{font-size:13.5px;color:var(--muted)}

/* ---------------- диагностика ---------------- */
.who-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:14px}
@media(max-width:900px){.who-grid{grid-template-columns:1fr 1fr}}
.who{border:1px solid var(--line);border-radius:var(--r);padding:18px 14px;text-align:center}
.who img{margin:0 auto 10px}
.who .n{font-family:var(--h);font-weight:700;font-size:14.5px}
.who .c{font-size:12.5px;color:var(--muted);margin-top:4px;line-height:1.35;min-height:34px}
.who .r{margin-top:10px}
.moments{position:relative;padding-left:4px}
.mo{display:grid;grid-template-columns:62px 18px 1fr;gap:12px;padding:12px 0;align-items:start}
.mo .ts{font-family:var(--h);font-weight:700;color:var(--blue);font-size:14px;padding-top:1px}
.mo .dot{width:12px;height:12px;border-radius:50%;margin-top:5px;background:var(--blue);box-shadow:0 0 0 4px var(--blue-50)}
.mo.bad .dot{background:var(--red);box-shadow:0 0 0 4px var(--red-50)}
.mo.ok .dot{background:var(--good);box-shadow:0 0 0 4px var(--good-50)}
.mo .t{font-weight:600;font-size:15px}
.mo .d{font-size:14px;color:var(--muted)}
.trbox{max-height:520px;overflow-y:auto;border:1px solid var(--line);border-radius:var(--r);margin-top:14px}
.trr{display:grid;grid-template-columns:54px 110px 1fr;gap:10px;padding:9px 16px;border-bottom:1px solid var(--line);font-size:13.5px}
.trr:last-child{border-bottom:none}
.trr .ts{color:var(--faint);font-size:12.5px;font-variant-numeric:tabular-nums}
.trr .sp{font-weight:600;display:flex;gap:7px;align-items:center}
.trr .sp i{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.trr.host{background:var(--soft);color:var(--muted)}

/* ---------------- карта сыгранности ---------------- */
.weak{display:grid;grid-template-columns:64px 1fr;gap:20px;padding:26px 0;border-top:1px solid var(--line)}
.weak:first-child{border-top:none;padding-top:4px}
@media(max-width:640px){.weak{grid-template-columns:1fr}}
.weak .num{width:54px;height:54px;border-radius:18px;background:var(--red-50);color:var(--red);font-family:var(--h);font-weight:800;font-size:22px;display:flex;align-items:center;justify-content:center}
.weak .t{font-family:var(--h);font-weight:700;font-size:19px;line-height:1.3;margin-bottom:8px}
.weak .x{font-size:15px;color:var(--ink2);max-width:820px}
.weak .qs{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:6px}
@media(max-width:760px){.weak .qs{grid-template-columns:1fr}}
.weak .bridge{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:16px;background:var(--blue-50);border-radius:var(--r-sm);padding:11px 14px;font-size:14px}
.weak .bridge b{color:var(--blue);font-weight:700}
.weak .rulel{font-size:14px;margin-top:10px;color:var(--ink2)}.weak .rulel b{color:var(--ink)}
.strong{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
@media(max-width:900px){.strong{grid-template-columns:1fr 1fr}}
.st{background:var(--good-50);border-radius:var(--r);padding:18px}
.st .ts{font-family:var(--h);font-weight:700;color:var(--good);font-size:13px}
.st .t{font-weight:700;font-size:14.5px;margin:4px 0}
.st .d{font-size:13.3px;color:var(--ink2)}
details.metrics{border:1px solid var(--line);border-radius:var(--r);padding:0 22px}
details.metrics summary{cursor:pointer;list-style:none;padding:18px 0;font-weight:600;display:flex;justify-content:space-between;align-items:center}
details.metrics summary::-webkit-details-marker{display:none}
details.metrics summary:after{content:"＋";color:var(--blue);font-size:18px}
details.metrics[open] summary:after{content:"－"}
table.mt{width:100%;border-collapse:collapse;margin-bottom:18px;font-size:14px}
table.mt td{padding:11px 8px;border-top:1px solid var(--line);vertical-align:top}
table.mt td.v{font-family:var(--h);font-weight:700;font-size:17px;white-space:nowrap;width:120px}
table.mt td.v span{font-size:12.5px;color:var(--faint);font-weight:600;font-family:var(--t)}
table.mt td.h{color:var(--muted);font-size:13.3px}

/* ---------------- траектории ---------------- */
.tj{display:grid;grid-template-columns:230px 1fr;gap:28px;padding:30px 0;border-top:1px solid var(--line)}
.tj:first-child{border-top:none;padding-top:6px}
@media(max-width:860px){.tj{grid-template-columns:1fr}}
.tj .pers{text-align:left}
.tj .pers .n{font-family:var(--h);font-weight:800;font-size:19px;margin-top:12px}
.tj .pers .w{font-size:13.5px;color:var(--muted);margin-top:4px}
.tj .cols{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:760px){.tj .cols{grid-template-columns:1fr}}
.box{border-radius:var(--r);padding:18px}
.box.g{background:var(--good-50)}.box.r{background:var(--soft)}
.box .k{font-size:12px;font-weight:700;letter-spacing:.9px;text-transform:uppercase;margin-bottom:7px}
.box.g .k{color:var(--good)}.box.r .k{color:var(--red)}
.box .x{font-size:14.2px}
.act{margin-top:16px;border:1.5px solid var(--blue);border-radius:var(--r);padding:16px 18px}
.act .k{font-size:12px;font-weight:700;letter-spacing:.9px;text-transform:uppercase;color:var(--blue);margin-bottom:6px}
.tasks{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
@media(max-width:760px){.tasks{grid-template-columns:1fr}}
.task{display:grid;grid-template-columns:26px 1fr;gap:8px;font-size:13px;background:var(--soft);border-radius:var(--r-sm);padding:9px 10px;line-height:1.4}
.task b{width:22px;height:22px;border-radius:50%;background:#fff;color:var(--blue);font-family:var(--h);font-size:11.5px;display:flex;align-items:center;justify-content:center}
.task.pri{background:var(--blue-50)}

/* ---------------- трек ---------------- */
.plan{display:flex;flex-direction:column;gap:10px}
.pl{display:grid;grid-template-columns:1.1fr 140px 1.3fr;gap:18px;align-items:center;padding:14px 18px;border:1px solid var(--line);border-radius:var(--r)}
@media(max-width:860px){.pl{grid-template-columns:1fr}}
.pl .w{font-weight:600;font-size:14.5px;display:flex;gap:10px;align-items:flex-start}
.pl .w i{flex-shrink:0;width:26px;height:26px;border-radius:9px;background:var(--red-50);color:var(--red);font-style:normal;font-family:var(--h);font-weight:800;font-size:13px;display:flex;align-items:center;justify-content:center}
.pl .c{display:flex;gap:6px;flex-wrap:wrap}
.pl .r{font-size:14px;color:var(--ink2)}
.pl .r:before{content:"Правило: ";color:var(--blue);font-weight:700}
.prio{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:16px;font-size:15px}
.prio .arrow{color:var(--faint)}
.track{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
@media(max-width:900px){.track{grid-template-columns:1fr 1fr}}
@media(max-width:600px){.track{grid-template-columns:1fr}}
.tc{background:#fff;border:1px solid var(--line);border-radius:var(--r-lg);padding:22px;text-align:left;display:flex;flex-direction:column;cursor:pointer;transition:.15s;position:relative}
.tc:hover{border-color:var(--blue);box-shadow:0 8px 28px rgba(28,79,216,.08);transform:translateY(-2px)}
.tc.pri{border-color:var(--blue);border-width:1.5px}
.tc .top{display:flex;justify-content:space-between;align-items:center}
.tc .no{font-family:var(--h);font-weight:800;font-size:34px;color:var(--blue-100);line-height:1}
.tc .t{font-family:var(--h);font-weight:700;font-size:16.5px;line-height:1.3;margin:12px 0 4px}
.tc .nm{color:var(--blue);font-weight:600;font-size:14px}
.tc .rule{margin-top:14px;padding-top:14px;border-top:1px solid var(--line);font-size:13.5px;color:var(--ink2);flex:1}
.tc .rule b{display:block;font-size:11.5px;letter-spacing:.9px;text-transform:uppercase;color:var(--faint);margin-bottom:4px}
.codex{background:var(--blue);color:#fff;border-radius:var(--r-lg);padding:34px;position:relative;overflow:hidden}
.codex:after{content:"";position:absolute;left:0;right:0;bottom:0;height:5px;background:linear-gradient(90deg,#fff 0 33.3%,#8FB0FF 33.3% 66.6%,var(--red) 66.6%)}
.codex h3{font-family:var(--h);font-size:28px;font-weight:800;margin-bottom:6px}
.codex .s{opacity:.85;margin-bottom:22px;max-width:720px}
.codex ol{list-style:none;counter-reset:c;display:grid;grid-template-columns:1fr 1fr;gap:12px 28px}
@media(max-width:760px){.codex ol{grid-template-columns:1fr}}
.codex li{counter-increment:c;display:grid;grid-template-columns:40px 1fr;gap:12px;font-size:15.5px;align-items:start;padding:10px 0;border-top:1px solid rgba(255,255,255,.2)}
.codex li:before{content:counter(c);font-family:var(--h);font-weight:800;font-size:22px;line-height:1.1;color:#BFD0FF}

/* кейс */
.back{display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:600;color:var(--blue);margin-bottom:18px}
.case-h{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
.skill{background:var(--soft);border-radius:var(--r);padding:18px 20px;font-size:15px;max-width:920px;margin-bottom:26px}
.skill b{display:block;font-size:12px;letter-spacing:1px;text-transform:uppercase;color:var(--blue);margin-bottom:6px}
.tabs{display:flex;gap:6px;margin-bottom:24px;flex-wrap:wrap;background:var(--soft);padding:6px;border-radius:40px;width:fit-content;max-width:100%}
.tabs button{padding:10px 18px;border-radius:40px;font-weight:600;font-size:14px;color:var(--muted)}
.tabs button.on{background:#fff;color:var(--ink);box-shadow:0 1px 4px rgba(14,26,51,.08)}
.rulebox{background:var(--blue);color:#fff;border-radius:var(--r);padding:20px 22px;margin-bottom:20px;display:flex;gap:16px;align-items:center}
.rulebox .k{font-size:12px;letter-spacing:1px;text-transform:uppercase;font-weight:700;opacity:.8}
.rulebox .v{font-family:var(--h);font-weight:700;font-size:18px;line-height:1.35}
.rulebox svg{width:34px;height:34px;flex-shrink:0;stroke:#fff;fill:none;stroke-width:1.8}
.pt{display:grid;grid-template-columns:30px 1fr;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line);font-size:14px}
.pt:first-child{border-top:none}
.cons{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.con{background:var(--soft);border-radius:var(--r-sm);padding:12px 14px}
.con .v{font-family:var(--h);font-weight:700;font-size:16px}
.con .l{font-size:12.5px;color:var(--muted)}
.inj{background:var(--warn-50);border-radius:var(--r-sm);padding:12px 14px;font-size:14px;margin-top:8px}
.inj b{color:var(--warn);font-family:var(--h);margin-right:6px}
.pcards{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
.pc{border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.pc .hd{display:flex;gap:12px;align-items:center;padding:16px 18px;background:var(--soft)}
.pc .hd .n{font-weight:700}.pc .hd .f{font-size:13px;color:var(--muted)}
.pc .bd{padding:16px 18px}
.pc .conf{font-size:11.5px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--red);margin-bottom:8px}

bPl7mxsLycY5JXxTz/aIGybC3PRNa55lljomZ9Zy8+wT9jAxjWgYaBgLOj4Fwvkr7OAuTnDKyBDnquZ4X1u4OFzJWoP/9k=","color":"#4A3AA7"}],"stakeholder":{"Дмитрий":"Вице-мэр по транспорту","Михаил":"Советник губернатора","Оксана":"Лидер инициативной группы жителей","Вано":"Координатор экоактивистов","Сергей":"Директор ТЦ, представитель предпринимателей"},"how":{"Дмитрий":"В этой сессии взял на себя цель и часть организации","Михаил":"В этой сессии собирал решение и удерживал команду от споров","Оксана":"В этой сессии вела коммуникацию, критику и риски","Вано":"В этой сессии вёл часть коммуникации и организации","Сергей":"В этой сессии работал как эксперт, функцию в команде не взял"},"diag":{"title":"ЛЕСОГОРСК · Дорога через Сосновый бор","summary":"Город строит дорогу вдоль лесного массива. Против — 8 430 жителей и экологи, за — бизнес, до выборов губернатора четыре месяца, федеральные деньги ждут заявку 30 дней. У каждого участника — закрытая карточка одной из сторон. Роли в команде заранее не закреплены.","task":"За 45 минут собрать решение из шести элементов: решение по проекту, сделка сторон, план на 30 дней, план на 12–24 месяца, публичная позиция, красные линии."},"moments":[["03:14","ok","Оксана выкладывает закрытое","Треть инициативной группы готова к компромиссу — прозвучало в первые минуты."],["06:24","warn","Сергей придерживает ресурсы","«Пока это всё, что я готов положить на стол». Команда не переспросила."],["07:47","bad","Потолок по вырубке отложен","«Давайте не будем сейчас в это уходить» — к вопросу вернулись через 25 минут."],["15:00","warn","Вброс: видео с техникой","Совместный выезд предложили быстро, но ответ отложили «на потом»."],["29:01","bad","Образ результата — только сейчас","«Мы это в начале не определили и вот сейчас на двадцать девятой минуте возвращаемся»."],["31:31","warn","Закрытые карты Сергея и Вано","120 млн бизнеса, девелопер и раскол коалиции — за три минуты до решения."],["34:20","warn","Решение зафиксировано","На 76% времени. Лист решения дописан в последние четыре минуты."]],"transcript":[{"ts":"00:00","who":"Ведущий","text":"Сорок пять минут. На руках у каждого общая ситуация и персональная карточка. Часть закрытой информации есть только у вас — как ей распорядиться, решаете сами. Продукт группы — шесть пунктов на финальном листе. Время пошло."},{"ts":"00:12","who":"Дмитрий","text":"Давайте по кругу. Я вице-мэр по транспорту, начну. Поток на южном направлении — 61 тысяча машин в сутки, к 2030-му будет 79. Средняя скорость в час пик 11–14 километров. Из Соснового квартала до центра утром сорок семь минут на девять с половиной километров."},{"ts":"00:31","who":"Дмитрий","text":"Дорога — 7,8 километра, 6,2 миллиарда, из них 4,5 федеральных. Три условия: тридцать дней на консолидированную заявку, сорок пять на подтверждение трассировки, контракт до конца года. Сорвём — деньги уходят в другой регион на два года."},{"ts":"00:52","who":"Дмитрий","text":"И сразу скажу то, чего нет в открытых материалах. Исходный маршрут выбран не потому, что он лучший. Он самый дешёвый и быстрее всех проходит процедуры. Это важно понимать, когда мы будем его защищать."},{"ts":"01:10","who":"Дмитрий","text":"Второе. Есть вариант смещения трассы на 220 метров к промышленной полосе. Вырубка падает с 18,6 примерно до 10,5 гектара. Цена — плюс 0,9 миллиарда и переработка части проектной документации."},{"ts":"01:28","who":"Дмитрий","text":"Третье. Внутри мэрии единства нет: экономика за быстрый запуск, юристы боятся исков уже после контракта. Мэр публично не говорил, но для него корректировка приемлема, если сохраняется шанс на федеральные деньги."},{"ts":"01:47","who":"Михаил","text":"Хорошо, что сразу выложил. Я советник губернатора по внутренней политике. У меня тоже есть закрытое, выкладываю."},{"ts":"01:57","who":"Михаил","text":"По закрытой социологии: если конфликт уйдёт в острый протестный цикл, губернатор теряет в городе от двух до четырёх пунктов рейтинга. Если показать доработку проекта после диалога — эффект нейтральный или умеренно положительный."},{"ts":"02:16","who":"Михаил","text":"Дальше. Губернатор готов добавить до 250 миллионов из областного резерва на компенсационные и защитные меры. Но только при двух условиях: подписан публичный протокол договорённостей и протестная температура снижается."},{"ts":"02:36","who":"Михаил","text":"И третье, это жёстко. Штаб категорически против картинки с ОМОНом, заборами и насильственным началом работ. Вариант «строим как есть и потом разберёмся» область не поддержит."},{"ts":"02:46","who":"Сергей","text":"Я бы ещё до карточек зафиксировал: у района уже есть инвестиционный цикл, который зависит от этого решения. Мы не с чистого листа обсуждаем."},{"ts":"02:52","who":"Оксана","text":"Я лидер инициативной группы «Не режьте бор», живу в квартале одиннадцать лет. Публичные цифры вы знаете: 8 430 подписей против текущего маршрута, 32 тысячи жителей, дома первой линии теряют от семи до двенадцати процентов стоимости."},{"ts":"03:14","who":"Оксана","text":"Теперь закрытое, и мне важно, чтобы это прозвучало сейчас, а не в конце. Внутри инициативной группы нет единства. Примерно треть активного ядра готова обсуждать компромисс — если маршрут сместят, будет юридически оформленный пакет гарантий и постоянный контроль со стороны жителей."},{"ts":"03:38","who":"Оксана","text":"Дальше. Часть жителей поддерживает дорогу из-за пробок, но публично молчит, чтобы не ссориться с соседями. И лично: мой муж каждое утро тратит до пятидесяти пяти минут на дорогу. Я транспортную проблему не отрицаю."},{"ts":"03:58","who":"Оксана","text":"И то, чего вам лучше не делать. Если предложите только компенсационное озеленение в другом конце города — я это перед районом не удержу. Люди сочтут это издевательством."},{"ts":"04:14","who":"Дмитрий","text":"Принял. Значит, поле для разговора есть."},{"ts":"04:19","who":"Вано","text":"Я координатор коалиции «Живой бор». По официальным данным постоянная вырубка 18,6 гектара. По нашей экспертной оценке — с учётом строительных площадок, временных подъездов, инженерных коридоров и зон складирования грунта — реальное воздействие 22–24 гектара."},{"ts":"04:42","who":"Вано","text":"Лес посещают до четырёх тысяч человек в день по выходным. Компенсационные посадки в другом районе зрелый лес рядом с жилым кварталом не заменяют. И у дороги есть не только шумовой эффект, но и барьерный."},{"ts":"05:01","who":"Вано","text":"Наша позиция: проект экологически недоработан. Мы против не развития, а некачественного проектирования."},{"ts":"05:12","who":"Дмитрий","text":"Это я услышал. Что вам нужно, чтобы позиция изменилась?"},{"ts":"05:18","who":"Вано","text":"И ещё: у проекта есть барьерный эффект. Дорога режет пешеходные маршруты, а это не лечится экранами. Про это в проектной документации нет ни строки."},{"ts":"05:19","who":"Вано","text":"Существенная коррекция маршрута. Независимая экологическая верификация. Не внутренний контроль силами заказчика и подрядчика."},{"ts":"05:31","who":"Сергей","text":"Я управляющий директор ТЦ «Галерея Юг», говорю и за объединение предпринимателей южного кластера. Улучшение доступности даёт рост посещаемости на 12–15 процентов, выручки арендаторов на 8–10, стоимости коммерческой земли вдоль дороги на 18–22."},{"ts":"05:56","who":"Сергей","text":"Плюс логистический парк. Если его запуск сдвинется на восемнадцать месяцев, бюджет недополучит около 320 миллионов налогов в год после выхода на мощность."},{"ts":"06:05","who":"Сергей","text":"Добавлю по срокам. Логистический парк уже законтрактовал часть резидентов. Если сдвиг восемнадцать месяцев, часть из них уйдёт в соседний регион, и это не только налоги — это рабочие места."},{"ts":"06:11","who":"Сергей","text":"Бизнес заинтересован не в конфликте, а в предсказуемом решении. Вот и всё."},{"ts":"06:19","who":"Дмитрий","text":"Всё? У тебя больше ничего в карточке?"},{"ts":"06:24","who":"Сергей","text":"Пока это всё, что я готов положить на стол."},{"ts":"06:30","who":"Михаил","text":"Ладно. У нас на столе пять позиций. Предлагаю не спорить, а сначала договориться, по какому правилу мы выбираем."},{"ts":"06:41","who":"Дмитрий","text":"Правило простое: сохранить федеральные деньги. Всё остальное — производные."},{"ts":"06:49","who":"Оксана","text":"Нет, не простое. Если правило только «сохранить деньги», мы получим исходный маршрут и суд через месяц."},{"ts":"06:59","who":"Дмитрий","text":"Я не сказал «любой ценой»."},{"ts":"07:03","who":"Оксана","text":"Ты сказал «всё остальное производные». Это и есть любой ценой."},{"ts":"07:10","who":"Михаил","text":"Секунду. Давайте так: жёсткое ограничение — федеральное окно. Цель оптимизации — снизить конфликт при сохранении проекта. Это разные вещи."},{"ts":"07:23","who":"Дмитрий","text":"Согласен с формулировкой."},{"ts":"07:27","who":"Вано","text":"А экологический ущерб у нас где? В ограничениях или в оптимизации?"},{"ts":"07:34","who":"Дмитрий","text":"В защитных мерах."},{"ts":"07:38","who":"Вано","text":"Это не ответ. Защитные меры — это следствие. Я спрашиваю, есть ли у нас потолок по вырубке."},{"ts":"07:47","who":"Дмитрий","text":"Давайте не будем сейчас в это уходить, у нас сорок пять минут."},{"ts":"07:53","who":"Вано","text":"Хорошо."},{"ts":"07:56","who":"Михаил","text":"Я бы всё-таки зафиксировал. Без потолка по вырубке мы через двадцать минут вернёмся к этому же спору."},{"ts":"07:57","who":"Вано","text":"Тогда я сформулирую прямо: у нас есть потолок по вырубке или нет? Это не риторика, от этого зависит, какие варианты мы вообще рассматриваем."},{"ts":"08:06","who":"Дмитрий","text":"Зафиксируем позже, когда выберем вариант."},{"ts":"08:12","who":"Сергей","text":"Мне тоже важно понимать рамку по срокам. Без графика бизнесу обсуждать нечего."},{"ts":"08:20","who":"Дмитрий","text":"График будет после варианта."},{"ts":"08:25","who":"Оксана","text":"У нас всё будет после варианта. А вариант мы на чём выбираем?"},{"ts":"08:33","who":"Дмитрий","text":"На сроках и деньгах."},{"ts":"08:37","who":"Оксана","text":"Тогда давайте честно: мы уже выбрали, просто ещё не признались."},{"ts":"08:44","who":"Михаил","text":"Оксана, подожди. Дмитрий, у нас три варианта на столе: строить как есть, корректировать, пауза. Пройдём по ним быстро?"},{"ts":"08:56","who":"Дмитрий","text":"Давай. Первый — текущий маршрут. Дешёвый, в сроки укладываемся точно."},{"ts":"09:05","who":"Оксана","text":"И суды. И восемь тысяч подписей. И обещание две тысячи двадцать четвёртого года, что масштабной вырубки не будет — его сейчас цитируют в каждом паблике."},{"ts":"09:12","who":"Сергей","text":"Можно уточню по цифре? 22–24 гектара — это с учётом временных площадок, которые потом рекультивируются, или это безвозвратно?"},{"ts":"09:18","who":"Вано","text":"И 22–24 гектара по факту вместо 18,6."},{"ts":"09:20","who":"Вано","text":"Часть рекультивируется. Но зрелый лес не восстанавливается за два года, а барьер остаётся навсегда."},{"ts":"09:25","who":"Дмитрий","text":"Ваша оценка не верифицирована."},{"ts":"09:30","who":"Вано","text":"Ваша тоже."},{"ts":"09:34","who":"Дмитрий","text":"Наша в проектной документации."},{"ts":"09:39","who":"Вано","text":"Которую писали под самый дешёвый маршрут. Мы это пять минут назад слышали от вас же."},{"ts":"09:47","who":"Дмитрий","text":"Я это сказал, чтобы мы понимали контекст, а не чтобы вы этим били."},{"ts":"09:55","who":"Михаил","text":"Так, стоп. Мы сейчас теряем время на кто кого поймал. Третий вариант — пауза."},{"ts":"10:04","who":"Сергей","text":"Пауза — нет. Это потеря федеральных денег и район в подвешенном состоянии. Бизнес такого не выдержит."},{"ts":"10:14","who":"Оксана","text":"Бизнес не выдержит, а район выдержит стройку под окнами?"},{"ts":"10:20","who":"Сергей","text":"Я не это сказал."},{"ts":"10:24","who":"Оксана","text":"Ты сказал ровно это."},{"ts":"10:28","who":"Михаил","text":"Коллеги. Остаётся второй вариант — корректировка. Дмитрий уже назвал параметры: смещение на 220 метров, вырубка до 10,5, плюс 0,9 миллиарда."},{"ts":"10:43","who":"Дмитрий","text":"Плюс 0,9 — это дыра. Город её не закроет."},{"ts":"10:50","who":"Михаил","text":"Область может часть закрыть."},{"ts":"10:55","who":"Дмитрий","text":"Насколько?"},{"ts":"10:59","who":"Михаил","text":"Скажу, когда будет понятно, под что. Резерв не выдаётся под намерение."},{"ts":"11:03","who":"Сергей","text":"У меня вопрос к обоим. Если область даёт деньги под протокол, а протокол требует согласия жителей и экологов — у нас порядок действий какой? Сначала протокол, потом деньги, или наоборот?"},{"ts":"11:08","who":"Оксана","text":"То есть у области деньги есть, но вы их держите, пока мы не согласимся?"},{"ts":"11:12","who":"Михаил","text":"Сначала протокол."},{"ts":"11:16","who":"Михаил","text":"Я держу их, пока нет протокола. Это разные вещи."},{"ts":"11:22","who":"Оксана","text":"Для нас это одно и то же."},{"ts":"11:27","who":"Вано","text":"Согласен с Оксаной. Нас зовут в переговоры, чтобы легитимировать уже принятое решение."},{"ts":"11:36","who":"Дмитрий","text":"Никто ничего не принял."},{"ts":"11:40","who":"Вано","text":"Тогда почему мы третий раз возвращаемся к тому, что корректировка — единственный вариант?"},{"ts":"11:49","who":"Дмитрий","text":"Потому что два других нерабочие."},{"ts":"11:54","who":"Вано","text":"Это и называется «уже принято»."},{"ts":"12:00","who":"Михаил","text":"Давайте я переформулирую. Корректировка — не решение. Это направление. Решение — это пакет: маршрут плюс гарантии плюс контроль плюс деньги плюс сроки. Вот пакет мы пока не собирали."},{"ts":"12:18","who":"Оксана","text":"Вот с этого и надо было начинать."},{"ts":"12:23","who":"Дмитрий","text":"Хорошо. Собираем пакет. Маршрут — смещение 220 метров."},{"ts":"12:31","who":"Вано","text":"Смещение на 220 метров даёт 10,5 гектара. Нам нужно 10–12. Формально проходит."},{"ts":"12:36","who":"Вано","text":"И параметр, который вы пропустили: полоса отвода. Если она остаётся прежней, смещение ничего не решает — техника всё равно зайдёт в лес на прежнюю глубину."},{"ts":"12:41","who":"Дмитрий","text":"Отлично, значит сходимся."},{"ts":"12:46","who":"Вано","text":"Я сказал «формально». Я не сказал, что коалиция это подпишет."},{"ts":"12:53","who":"Дмитрий","text":"А что нужно, чтобы подписала?"},{"ts":"12:58","who":"Вано","text":"Верификация, экопереходы, запрет расширения коридора в лес, публикация всех замеров."},{"ts":"13:08","who":"Дмитрий","text":"Записываю."},{"ts":"13:12","who":"Оксана","text":"А у жителей? Про нас пока ни слова."},{"ts":"13:18","who":"Дмитрий","text":"Шумозащита, буфер, ограничение ночного грузового."},{"ts":"13:25","who":"Оксана","text":"Параметры. Не слова. Экраны не меньше трёх километров, буфер не меньше сорока метров, публичный мониторинг замеров, право жителей блокировать ухудшение параметров без повторных переговоров."},{"ts":"13:31","who":"Сергей","text":"Я тоже хочу параметр. Доступ к ТЦ в период стройки: сколько недель район живёт с перекрытым подъездом?"},{"ts":"13:38","who":"Дмитрий","text":"Пока не считали."},{"ts":"13:44","who":"Дмитрий","text":"Последнее — это право вето на проект. Так не пойдёт."},{"ts":"13:51","who":"Оксана","text":"Это право вето на ухудшение того, о чём договорились. Разница принципиальная."},{"ts":"14:01","who":"Дмитрий","text":"Всё равно тяжело. Вернёмся."},{"ts":"14:07","who":"Оксана","text":"Мы к этому не вернёмся, я по опыту знаю."},{"ts":"14:13","who":"Михаил","text":"Вернёмся, я прослежу."},{"ts":"14:18","who":"Сергей","text":"Можно я про сроки? У нас на всё тридцать дней по заявке, а мы пока не написали ни одного пункта."},{"ts":"14:28","who":"Дмитрий","text":"Успеем."},{"ts":"14:33","who":"Вано","text":"Тридцать дней — это на заявку. А на то, чтобы мы вообще друг другу поверили, сколько?"},{"ts":"15:00","who":"Ведущий","text":"Вброс. В городских пабликах и телеграм-каналах разошлось видео с подписью: «Мэрия уже начала вырубку в Сосновом бору, пока жителям рассказывают сказки про общественные обсуждения». За два часа 180 тысяч просмотров, 12 тысяч репостов, более 4 500 комментариев. Местные СМИ запрашивают комментарий у мэрии. По предварительной информации, на видео действительно видна техника, но неясно, относится ли она к проекту дороги или к соседним инженерным работам."},{"ts":"15:34","who":"Оксана","text":"Ну вот. Именно об этом я и говорила."},{"ts":"15:40","who":"Дмитрий","text":"Это не наша техника."},{"ts":"15:45","who":"Вано","text":"Вы уверены?"},{"ts":"15:49","who":"Дмитрий","text":"Работы по дороге не начаты, контракта нет."},{"ts":"15:56","who":"Вано","text":"Я спрашиваю не про дорогу. Я спрашиваю, чья это техника."},{"ts":"16:03","who":"Дмитрий","text":"Разберёмся."},{"ts":"16:07","who":"Оксана","text":"«Разберёмся» — это ровно то слово, после которого у нас появилось восемь тысяч подписей."},{"ts":"16:16","who":"Михаил","text":"Так, это уже политическая история, не проектная. Штаб через час будет звонить."},{"ts":"16:25","who":"Дмитрий","text":"И что мы им скажем?"},{"ts":"16:30","who":"Михаил","text":"Что угодно, кроме «мы не знаем»."},{"ts":"16:36","who":"Сергей","text":"Может, просто выложить, что работы не начаты?"},{"ts":"16:42","who":"Оксана","text":"Вам не поверят. В две тысячи двадцать четвёртом уже обещали, что вырубки не будет."},{"ts":"16:51","who":"Сергей","text":"Тогда я не понимаю, что вообще можно сказать."},{"ts":"16:57","who":"Вано","text":"Можно сказать правду: мы не знаем, чья техника, и выясним за три часа. С выездом. Совместным."},{"ts":"17:07","who":"Дмитрий","text":"Совместный выезд с кем?"},{"ts":"17:12","who":"Вано","text":"С нами и с жителями. Иначе любой ваш ответ — это ваше слово против видео."},{"ts":"17:21","who":"Оксана","text":"Поддерживаю. Я готова поехать."},{"ts":"17:27","who":"Дмитрий","text":"Это надо согласовывать."},{"ts":"17:32","who":"Оксана","text":"С кем? Вы вице-мэр."},{"ts":"17:37","who":"Дмитрий","text":"С пресс-службой как минимум."},{"ts":"17:42","who":"Михаил","text":"Слушайте, мы сейчас на это потратим ещё десять минут. Давайте вернёмся к пакету, а видео — отдельно."},{"ts":"17:53","who":"Вано","text":"Отдельно — это когда?"},{"ts":"17:58","who":"Михаил","text":"В конце."},{"ts":"18:02","who":"Вано","text":"В конце ролик наберёт полмиллиона."},{"ts":"18:08","who":"Дмитрий","text":"Вано, давайте без лозунгов."},{"ts":"18:14","who":"Вано","text":"Это не лозунг, это арифметика распространения."},{"ts":"18:21","who":"Михаил","text":"Хорошо. Фиксирую пункт: кризисная коммуникация по видео. Детали потом."},{"ts":"18:30","who":"Оксана","text":"«Потом» без фамилии и без часа — это не пункт."},{"ts":"18:37","who":"Дмитрий","text":"Оксана, мы поняли твою позицию."},{"ts":"18:43","who":"Оксана","text":"Не уверена."},{"ts":"18:47","who":"Дмитрий","text":"Возвращаемся к маршруту. Смещение 220 метров, вырубка 10,5. Кто против?"},{"ts":"18:57","who":"Сергей","text":"А что со сроками при смещении? Документацию переделывать."},{"ts":"19:05","who":"Дмитрий","text":"Частично."},{"ts":"19:09","who":"Сергей","text":"Частично — это сколько месяцев?"},{"ts":"19:15","who":"Дмитрий","text":"От двух до четырёх по общей оценке."},{"ts":"19:21","who":"Сергей","text":"А у нас сорок пять дней на подтверждение трассировки."},{"ts":"19:28","who":"Дмитрий","text":"Трассировку можно подтвердить решением, а документацию доводить параллельно."},{"ts":"19:37","who":"Сергей","text":"Это так работает?"},{"ts":"19:42","who":"Дмитрий","text":"Это так делается."},{"ts":"19:47","who":"Сергей","text":"Ладно."},{"ts":"19:52","who":"Михаил","text":"Так, у нас есть маршрут. Дальше что?"},{"ts":"19:58","who":"Оксана","text":"Дальше гарантии. Я третий раз про них говорю."},{"ts":"20:05","who":"Дмитрий","text":"Я записал: экраны, буфер, ночной запрет."},{"ts":"20:12","who":"Оксана","text":"Без цифр это не гарантии."},{"ts":"20:17","who":"Дмитрий","text":"Цифры возьмём из проекта."},{"ts":"20:22","who":"Оксана","text":"Проект пишет мэрия. То есть гарантии жителей пишет та сторона, от которой жители защищаются."},{"ts":"20:32","who":"Михаил","text":"Логично."},{"ts":"20:36","who":"Дмитрий","text":"И что предлагаешь?"},{"ts":"20:41","who":"Оксана","text":"Наблюдательный совет с правом доступа к замерам. И протокол, где параметры зафиксированы цифрами."},{"ts":"20:51","who":"Дмитрий","text":"Совет — согласен. Протокол — надо смотреть юридическую форму."},{"ts":"21:00","who":"Оксана","text":"Смотрите."},{"ts":"21:04","who":"Вано","text":"Нам нужна независимая верификация. Это отдельно от совета."},{"ts":"21:12","who":"Дмитрий","text":"Это дорого и долго."},{"ts":"21:17","who":"Вано","text":"Дешевле, чем остановка стройки по иску."},{"ts":"21:23","who":"Дмитрий","text":"Иска ещё нет."},{"ts":"21:27","who":"Вано","text":"Пока нет."},{"ts":"21:31","who":"Дмитрий","text":"Это угроза?"},{"ts":"21:35","who":"Вано","text":"Это прогноз."},{"ts":"21:39","who":"Михаил","text":"Коллеги, мы опять в пикировке. Двадцать вторая минута, у нас ноль записанных пунктов."},{"ts":"21:49","who":"Дмитрий","text":"Согласен. Сергей, ты что молчишь?"},{"ts":"21:55","who":"Сергей","text":"Жду, пока вы договоритесь о маршруте. Мне без маршрута нечего считать."},{"ts":"22:04","who":"Дмитрий","text":"Маршрут есть — смещение."},{"ts":"22:09","who":"Сергей","text":"Тогда по доступу к ТЦ в период стройки нужен отдельный пункт. И график."},{"ts":"22:18","who":"Дмитрий","text":"Записал."},{"ts":"22:22","who":"Михаил","text":"Кто записывает, кстати? У нас лист один."},{"ts":"22:28","who":"Дмитрий","text":"Я записываю."},{"ts":"22:32","who":"Михаил","text":"Покажи, что там."},{"ts":"22:36","who":"Дмитрий","text":"Маршрут, экраны, буфер, ночной запрет, совет, верификация, доступ к ТЦ."},{"ts":"22:46","who":"Оксана","text":"Это список слов. Ни одной цифры, ни одной фамилии, ни одного срока."},{"ts":"22:55","who":"Дмитрий","text":"Цифры доберём."},{"ts":"23:00","who":"Оксана","text":"Когда?"},{"ts":"23:04","who":"Дмитрий","text":"Сейчас и доберём. Экраны — сколько?"},{"ts":"23:10","who":"Оксана","text":"Не меньше трёх километров. У нас в требованиях 3, в проекте 2,1."},{"ts":"23:18","who":"Дмитрий","text":"3,4 по варианту со смещением."},{"ts":"23:24","who":"Оксана","text":"Хорошо. Буфер?"},{"ts":"23:29","who":"Дмитрий","text":"В проекте 25 метров."},{"ts":"23:34","who":"Оксана","text":"Нужно не меньше сорока."},{"ts":"23:39","who":"Дмитрий","text":"Сорок — это ещё земля."},{"ts":"23:44","who":"Оксана","text":"Сорок — это то, ниже чего я не выйду к району."},{"ts":"23:51","who":"Дмитрий","text":"Запишем сорок, но с оговоркой «в пределах полосы отвода»."},{"ts":"24:00","who":"Оксана","text":"Оговорка съедает пункт."},{"ts":"24:05","who":"Дмитрий","text":"Без оговорки я его не подпишу."},{"ts":"24:11","who":"Михаил","text":"Запишем сорок, оговорку обсудим с юристами. Идём дальше."},{"ts":"24:19","who":"Вано","text":"Экопереходы?"},{"ts":"24:23","who":"Дмитрий","text":"Два."},{"ts":"24:27","who":"Вано","text":"Записали."},{"ts":"25:00","who":"Ведущий","text":"Вброс. В канцелярию мэрии поступило письмо из аппарата губернатора. Область готова поддержать заявку на федеральное финансирование, но только если в течение десяти дней город представит согласованный вариант действий, пакет мер по снижению социального конфликта, понятную публичную позицию и подтверждение, что проект не приведёт к острой эскалации перед выборами. Отдельно указано: губернатор не поддержит вариант «строим как есть и потом разберёмся»."},{"ts":"25:36","who":"Ведущий","text":"Две минуты на чтение."},{"ts":"27:36","who":"Дмитрий","text":"Десять дней."},{"ts":"27:41","who":"Михаил","text":"Десять. И это не мой каприз, это письмо."},{"ts":"27:48","who":"Дмитрий","text":"У нас было тридцать."},{"ts":"27:53","who":"Михаил","text":"Тридцать на заявку. Десять — на согласованный вариант внутри."},{"ts":"28:02","who":"Сергей","text":"То есть реально у нас неделя с небольшим на всё, что мы тут перечисляем словами. И ни одного пункта на бумаге."},{"ts":"28:13","who":"Оксана","text":"И протокола, которого ещё нет."},{"ts":"28:19","who":"Дмитрий","text":"Ладно. Это даже хорошо: «строим как есть» отпадает окончательно."},{"ts":"28:27","who":"Вано","text":"Оно отпало двадцать минут назад, просто вы это не признавали."},{"ts":"28:35","who":"Дмитрий","text":"Вано, мы сейчас не о том."},{"ts":"28:40","who":"Михаил","text":"Важно, что теперь есть внешнее основание для корректировки. Это надо использовать, а не обсуждать."},{"ts":"28:50","who":"Дмитрий","text":"Согласен. Тогда ещё раз: какой у нас образ результата? Что мы выносим через десять дней?"},{"ts":"29:01","who":"Оксана","text":"Мы это в начале не определили и вот сейчас на двадцать девятой минуте возвращаемся."},{"ts":"29:11","who":"Дмитрий","text":"Значит определим сейчас."},{"ts":"29:16","who":"Михаил","text":"Выносим: согласованный вариант трассировки, пакет мер, публичную формулу, подписи сторон."},{"ts":"29:26","who":"Оксана","text":"Четырёх сторон. Жители и экологи — это не одна сторона."},{"ts":"29:34","who":"Вано","text":"Спасибо."},{"ts":"29:38","who":"Дмитрий","text":"И бизнес. Пять."},{"ts":"29:43","who":"Сергей","text":"Бизнес подпишет, если будет график. Дмитрий, вы четвёртый раз говорите «будет», а даты ни одной."},{"ts":"29:54","who":"Дмитрий","text":"Потому что дата зависит от маршрута."},{"ts":"30:00","who":"Сергей","text":"Маршрут мы выбрали на двенадцатой минуте."},{"ts":"30:07","who":"Дмитрий","text":"Формально."},{"ts":"30:11","who":"Сергей","text":"Тогда скажите, чего не хватает, чтобы он стал не формальным. Я тридцать минут не понимаю, чего мы ждём."},{"ts":"30:22","who":"Михаил","text":"Денег не хватает. Плюс 0,9 миллиарда."},{"ts":"30:29","who":"Дмитрий","text":"Город не потянет. У нас 0,6 в проекте и 148 миллионов уже списаны на подготовку."},{"ts":"30:40","who":"Михаил","text":"Область даёт до 250 миллионов на компенсационные и защитные меры. Не на стройку. И только под подписанный протокол."},{"ts":"30:52","who":"Оксана","text":"То есть у области деньги есть, но вы их держали двадцать восемь минут."},{"ts":"31:01","who":"Михаил","text":"Я сказал про них на третьей минуте. Я держал условие, а не сумму."},{"ts":"31:09","who":"Оксана","text":"Хорошо, извини."},{"ts":"31:14","who":"Дмитрий","text":"250 из 900. Разрыв 650."},{"ts":"31:21","who":"Сергей","text":"Тогда я скажу то, что держал."},{"ts":"31:27","who":"Дмитрий","text":"Держал?"},{"ts":"31:31","who":"Сергей","text":"Объединение предпринимателей готово вложить до 120 миллионов. Благоустройство входной зоны леса, шумозащита на участке у коммерческой зоны, общественное пространство. Условие одно: понятный график и письменная гарантия, что вопрос не уйдёт в бессрочную паузу."},{"ts":"31:51","who":"Оксана","text":"Сто двадцать миллионов. И ты молчал тридцать одну минуту."},{"ts":"31:58","who":"Сергей","text":"Я ждал, пока появится решение. Деньги под разговор не дают. Вы меня спросили один раз, на шестой минуте, и приняли ответ."},{"ts":"32:11","who":"Михаил","text":"Это меняет конструкцию. Разрыв уже 530."},{"ts":"32:18","who":"Сергей","text":"И ещё. Девелопер «Лесной линии» неформально готов присоединиться к инфраструктурному соглашению. У меня были с ним предварительные переговоры."},{"ts":"32:31","who":"Дмитрий","text":"Это надо было в первые пять минут."},{"ts":"32:37","who":"Сергей","text":"Согласен."},{"ts":"32:41","who":"Вано","text":"Раз пошла такая честность. У коалиции нет ресурсов на многолетнюю юридическую войну. Экспертное крыло готово обсуждать вариант наименьшего вреда. Радикальное ядро требует «никакой дороги», но оно не вся коалиция."},{"ts":"32:59","who":"Оксана","text":"Вано."},{"ts":"33:03","who":"Вано","text":"Я держал это, потому что не хотел, чтобы это использовали как «они и так согласятся»."},{"ts":"33:12","who":"Дмитрий","text":"Мы бы и использовали."},{"ts":"33:17","who":"Вано","text":"Вот именно."},{"ts":"33:21","who":"Михаил","text":"Так. Одиннадцать минут. Собираю. Решение: корректировка проекта, смещение трассы на 220 метров, вырубка до 10,5 гектара, полоса отвода сужается."},{"ts":"33:36","who":"Михаил","text":"Пакет: экраны 3,4 километра, буфер сорок метров, два экоперехода, запрет ночного грузового транзита, независимая верификация с назначенной датой, наблюдательный совет с доступом к замерам, публикация всех замеров, запрет расширения коридора в лес."},{"ts":"33:57","who":"Михаил","text":"Деньги: 250 миллионов область на меры, 120 миллионов бизнес на благоустройство и шумозащиту, остаток по стройке — обращение к федерации плюс этапность. Сроки: десять дней на согласованный вариант и протокол, тридцать дней на заявку."},{"ts":"34:20","who":"Дмитрий","text":"Принимаю. Решение зафиксировано: корректируем, пакет такой, к составу решения больше не возвращаемся."},{"ts":"34:32","who":"Оксана","text":"Записано."},{"ts":"34:36","who":"Вано","text":"Записано."},{"ts":"34:40","who":"Сергей","text":"Записано, при условии графика."},{"ts":"34:46","who":"Михаил","text":"Отлично. Тогда дальше — лист. Шесть пунктов, и у нас десять минут."},{"ts":"34:52","who":"Оксана","text":"Десять минут на шесть пунктов, каждый из которых мы не обсуждали."},{"ts":"35:00","who":"Ведущий","text":"Вброс. Независимая лаборатория, которую ранее нанимали жители, публикует краткую записку. По их оценке, при базовом проекте и текущих мерах защиты шумовая нагрузка у трёх домов первой линии после ввода дороги может превысить норматив в часы пик на 12–18 процентов. При варианте со смещением трассы на 220 метров и экранами длиной 3,4 километра превышение снижается до 3–5 процентов, а при дополнительном зелёном буфере почти убирается. Записка расходится по СМИ как доказательство, что текущий проект вреден для жителей."},{"ts":"35:38","who":"Оксана","text":"Три дома. Двенадцать-восемнадцать процентов. Это ровно то, о чём я говорила на восьмой минуте."},{"ts":"35:49","who":"Дмитрий","text":"И это работает на нас. Смещение теперь обосновано замером, а не давлением."},{"ts":"35:58","who":"Михаил","text":"Для губернатора это идеальная рамка: не уступили протесту, а отреагировали на цифру."},{"ts":"36:08","who":"Вано","text":"При условии, что замер признают. Он сделан по заказу жителей."},{"ts":"36:16","who":"Дмитрий","text":"Мы его и признаём, раз он совпадает с нашим вариантом."},{"ts":"36:23","who":"Вано","text":"Удобно."},{"ts":"36:27","who":"Оксана","text":"Вано, не сейчас."},{"ts":"36:31","who":"Вано","text":"Я просто отмечаю, что критерий признания у нас плавающий. Завтра придёт замер не в нашу сторону — и мы скажем, что он заказной."},{"ts":"36:44","who":"Михаил","text":"Отмечено. Но у нас восемь минут, и ноль строк на листе."},{"ts":"36:52","who":"Сергей","text":"Тогда давайте посчитаем, что реально меняется в деньгах. Если превышение падает до трёх-пяти процентов, часть шумозащиты у коммерческой зоны можно ужать, и мои сто двадцать растянутся дальше."},{"ts":"37:07","who":"Дмитрий","text":"Сколько нужно времени?"},{"ts":"37:11","who":"Сергей","text":"Минута."},{"ts":"37:14","who":"Ведущий","text":"Минута на пересчёт."},{"ts":"38:14","who":"Сергей","text":"Если экраны у коммерческой зоны сокращаются на шестьсот метров, высвобождается порядка восемнадцати миллионов. Немного, но это перекрывает благоустройство входной зоны целиком."},{"ts":"38:29","who":"Михаил","text":"Принято, вписываю в пакет."},{"ts":"38:34","who":"Дмитрий","text":"Пункт один — решение. Оно принято: корректировка проекта, смещение на 220 метров, вырубка до 10,5 гектара, пакет мер по списку Михаила. Дальше."},{"ts":"38:49","who":"Оксана","text":"Подождите. Пункт два — сделка. Мы ни разу не проговорили, что каждая сторона отдаёт."},{"ts":"38:59","who":"Дмитрий","text":"Мы это делали по ходу."},{"ts":"39:04","who":"Оксана","text":"Мы этого не делали. Жители отдают лес — частично. Экологи отдают требование остановки. Бизнес отдаёт сто двадцать миллионов. А что отдаёт мэрия?"},{"ts":"39:19","who":"Дмитрий","text":"Мэрия отдаёт 0,9 миллиарда и четыре месяца."},{"ts":"39:26","who":"Оксана","text":"Мэрия отдаёт то, чего у неё нет. Это не уступка, это дефицит."},{"ts":"39:34","who":"Михаил","text":"Оксана, справедливо. Но у нас пять минут."},{"ts":"39:40","who":"Оксана","text":"Я про это и говорю. Мы дошли до сути на сороковой минуте."},{"ts":"39:48","who":"Дмитрий","text":"Пишем таблицу коротко. Михаил, диктуй, я записываю."},{"ts":"39:55","who":"Михаил","text":"Жители: получают смещение, экраны, буфер, наблюдательный совет, публичный мониторинг. Отдают протестную кампанию и согласие на строительство."},{"ts":"40:08","who":"Михаил","text":"Экологи: получают верификацию, два экоперехода, запрет расширения коридора, публикацию замеров. Отдают требование полной остановки."},{"ts":"40:21","who":"Михаил","text":"Бизнес: получает график и необратимость решения. Отдаёт сто двадцать миллионов и публичную поддержку компромисса."},{"ts":"40:33","who":"Михаил","text":"Область: получает протокол и снижение протестной температуры. Отдаёт двести пятьдесят миллионов."},{"ts":"40:43","who":"Михаил","text":"Мэрия: получает живой проект и заявку на федеральные деньги. Отдаёт исходный маршрут, 0,9 миллиарда и часть управленческой автономии."},{"ts":"40:57","who":"Дмитрий","text":"Записал."},{"ts":"41:01","who":"Вано","text":"Запрет расширения коридора попал в таблицу, но в пакет наверху не попал."},{"ts":"41:09","who":"Дмитрий","text":"Добавь наверх."},{"ts":"41:13","who":"Ведущий","text":"Сорок одна минута. Четыре минуты до сдачи листа."},{"ts":"41:20","who":"Дмитрий","text":"Пункт три — тридцать дней. Десять дней: решение по трассировке, протокол с подписями сторон, публичная позиция, назначение независимой верификации. Тридцать дней: консолидированная заявка в федерацию."},{"ts":"41:38","who":"Оксана","text":"И выезд на площадку с жителями. По видео — в первые сутки."},{"ts":"41:46","who":"Дмитрий","text":"И выезд. В первые сутки."},{"ts":"41:51","who":"Сергей","text":"Кто отвечает за каждый пункт?"},{"ts":"41:56","who":"Дмитрий","text":"Трассировка — департамент транспорта. Протокол — юридический блок. Публичная позиция — пресс-служба совместно с аппаратом области."},{"ts":"42:08","who":"Михаил","text":"Фамилий нет, но хотя бы блоки."},{"ts":"42:13","who":"Сергей","text":"Для бизнеса блока мало. Мне нужен человек и дата, иначе сто двадцать миллионов не выйдут из совета директоров."},{"ts":"42:24","who":"Дмитрий","text":"Проставим после сессии."},{"ts":"42:29","who":"Сергей","text":"Это ответ не мне, а протоколу."},{"ts":"42:34","who":"Дмитрий","text":"Сергей, у нас две с половиной минуты."},{"ts":"42:39","who":"Сергей","text":"Ладно."},{"ts":"42:43","who":"Дмитрий","text":"Пункт четыре — двенадцать-двадцать четыре месяца. Наблюдательный совет заседает раз в квартал, замеры публикуются, контрольные точки на три, шесть и двенадцать месяцев."},{"ts":"42:57","who":"Вано","text":"А что происходит, если контрольная точка не пройдена?"},{"ts":"43:04","who":"Дмитрий","text":"Пересматриваем."},{"ts":"43:08","who":"Вано","text":"Кто пересматривает и по какой процедуре?"},{"ts":"43:14","who":"Дмитрий","text":"Вано, впишем «совет инициирует пересмотр». Дальше."},{"ts":"43:21","who":"Михаил","text":"Пункт пять — публичная формула. «Город не отказался от дороги и не проигнорировал жителей: проект изменён по результатам независимого замера, обязательства зафиксированы протоколом и проверяются наблюдательным советом с участием жителей и экологов»."},{"ts":"43:41","who":"Оксана","text":"Формула нормальная. Первая нормальная вещь за сорок три минуты."},{"ts":"43:49","who":"Дмитрий","text":"Пункт шесть — красные линии. Неприемлемо: потеря федерального финансирования, начало работ без подписанного протокола, вырубка сверх 10,5 гектара."},{"ts":"44:03","who":"Вано","text":"Триггер пересмотра?"},{"ts":"44:08","who":"Дмитрий","text":"Превышение шумового норматива по факту замеров после ввода."},{"ts":"44:16","who":"Вано","text":"Записали."},{"ts":"44:21","who":"Оксана","text":"А три риска с мерами? Это внутри шестого пункта."},{"ts":"44:28","who":"Дмитрий","text":"Диктую на ходу: эскалация протеста, срыв десятидневного срока, разрыв по деньгам."},{"ts":"44:38","who":"Михаил","text":"Меры?"},{"ts":"44:42","who":"Дмитрий","text":"Совет, календарь, обращение в федерацию. По одной на каждый."},{"ts":"44:50","who":"Ведущий","text":"Время. Сдаём лист."},{"ts":"44:55","who":"Оксана","text":"Мы половину листа дописали за последние четыре минуты."},{"ts":"45:00","who":"Дмитрий","text":"Зато дописали. Сдаём."}],"weak":[{"key":"info","rule":3,"cases":[3],"title":"Решение формируется до сбора экспертизы","obs":"Двое из пяти держали ключевую закрытую информацию больше получаса. Команда уже собирала пакет решения, не зная о деньгах бизнеса и о слабости коалиции.","evidence":[["06:24","Сергей","«Пока это всё, что я готов положить на стол» — первый круг закрыт без его главного ресурса"],["12:23","Дмитрий","«Собираем пакет. Маршрут — смещение 220 метров» — решение уже формируется"],["31:31","Сергей","впервые называет 120 млн от объединения предпринимателей"],["32:41","Вано","впервые говорит, что у коалиции нет ресурсов на долгую юридическую войну"]],"impact":"Около двадцати минут пакет собирали без двух ключевых ресурсов и спорили о том, чего не хватает. Как только информация легла на стол, Михаил собрал решение за две минуты (33:21).","train":"Раунд обязательного внесения: до обсуждения вариантов каждый называет ресурс или ограничение, которыми владеет только его сторона."},{"key":"roles","rule":1,"cases":[1,5],"title":"Роли не распределены — функции выполняют не те, кто должен","obs":"Роль, отвечающую за внедряемость решения, не взял никто. Михаил делал работу Стратега, Сергей полчаса работал без функции в команде.","evidence":[["06:30","Михаил","предлагает сначала договориться о правиле выбора — работа Стратега"],["21:55","Сергей","«Жду, пока вы договоритесь о маршруте. Мне без маршрута нечего считать»"],["41:51","Сергей","«Кто отвечает за каждый пункт?» — вопрос звучит на 42-й минуте"],["42:24","Дмитрий","«Проставим после сессии»"]],"impact":"В итоговом листе нет ни одного владельца шага. Деньги бизнеса без человека и даты не выйдут из совета директоров (42:13).","train":"Роли — вслух в первые пять минут: кто держит цель, кто — внедрение, кто — план. У каждой задачи один отвечающий."},{"key":"goal","rule":2,"cases":[2],"title":"Варианты обсуждаются раньше, чем цель","obs":"Что именно команда сдаёт, договорились только на 29-й минуте. До этого правило выбора было «сохранить деньги», и каждый спорил со своей позиции.","evidence":[["06:41","Дмитрий","«Правило простое: сохранить федеральные деньги. Всё остальное — производные»"],["08:37","Оксана","«Мы уже выбрали, просто ещё не признались»"],["29:01","Оксана","«Мы это в начале не определили и вот сейчас на двадцать девятой минуте возвращаемся»"],["29:16","Михаил","впервые называет, что выносим: вариант трассы, пакет мер, публичную формулу, подписи"]],"impact":"Две трети времени ушло на спор о вариантах без общего критерия. К сути сделки сторон команда дошла на 40-й минуте (39:40).","train":"Цель одним предложением до разговора о вариантах: что сдаём и по какому правилу выбираем."},{"key":"dissent","rule":4,"cases":[3,4],"title":"Возражения закрывают, а не отвечают на них","obs":"7 из 18 возражений остались без ответа. Вано дважды прямо спросил о потолке вырубки — в ответ услышал «зафиксируем позже» (08:06).","evidence":[["07:38","Вано","«Я спрашиваю, есть ли у нас потолок по вырубке»"],["07:47","Дмитрий","«Давайте не будем сейчас в это уходить, у нас сорок пять минут»"],["18:37","Дмитрий","«Оксана, мы поняли твою позицию»"],["28:35","Дмитрий","«Вано, мы сейчас не о том»"]],"impact":"Закрытые возражения возвращаются позже и дороже: процедуру пересмотра и триггер команда дописывала в последние две минуты (43:08–44:08).","train":"Отложенное — в общий лист с минутой возврата. Возражение закрыто, только когда на него ответили по существу."},{"key":"tempo","rule":6,"cases":[4,6],"title":"Решение фиксируют поздно, план дописывают в спешке","obs":"Решение зафиксировано на 34:20 — на 76% времени. Половину финального листа написали за последние четыре минуты.","evidence":[["34:20","Дмитрий","«Принимаю. Решение зафиксировано»"],["43:14","Дмитрий","«Впишем „совет инициирует пересмотр“. Дальше»"],["44:28","Дмитрий","три риска «диктую на ходу», меры — по одной на каждый"],["44:55","Оксана","«Мы половину листа дописали за последние четыре минуты»"]],"impact":"План не готов к исполнению: у шагов нет владельцев, три риска и меры к ним надиктованы за последние полминуты.","train":"Решение — к середине времени, вторая половина — на план. У каждого решения владелец и срок, статус — 90 секунд."}],"strong":[["33:21","Михаил собрал решение за две минуты","Как только информация оказалась на столе, Интегратор свёл всё в одну конструкцию."],["13:25","Оксана перевела разговор в параметры","«Параметры. Не слова.» — экраны, буфер, контроль вместо лозунгов."],["12:36","Вано нашёл скрытую зависимость","Полоса отвода: без неё смещение трассы ничего не решает."],["34:20","Дмитрий закрыл выбор вслух","После фиксации команда к составу решения не возвращалась."]],"metrics":[{"v":"3<span> из 5</span>","n":"Роли сыграны","h":"Стратег, Коммуникатор и Интегратор сыграны; Организатор — частично; роль Реформатора не взял никто."},{"v":"81<span> из 100</span>","n":"Включённость в решение","h":"Все пятеро участвовали на всех этапах выработки решения; слабее всего — практичные выводы."},{"v":"22,5<span> из 30</span>","n":"Результат кейса","h":"Чек-лист решения: 20 пунктов закрыто, 5 частично, 5 нет."},{"v":"61<span> из 100</span>","n":"Открытость разногласий","h":"11 из 18 возражений получили ответ или вошли в решение."},{"v":"53<span> из 100</span>","n":"Использование экспертизы","h":"Закрытая информация прозвучала вся, до решения дошла примерно половина."},{"v":"30<span> из 100</span>","n":"Динамика решения","h":"Решение зафиксировано на 34:20 — на 76% отведённого времени."},{"v":"80<span> из 100</span>","n":"Равномерность вклада","h":"Доли речи участников — от 16 до 25%."}],"traj":[{"name":"Дмитрий","short":"Дмитрий","good":"В этой сессии вы довели обсуждение до выбора и закрыли его вслух — после этого команда к составу решения не возвращалась. Когда пришло письмо из области, вы первым вернули разговор к тому, что команда выносит.","good_quote":{"ts":"34:20","text":"Принимаю. Решение зафиксировано: корректируем, пакет такой, к составу решения больше не возвращаемся."},"missed":"В обсуждении проявилось: спорные вопросы вы чаще откладывали «на потом», чем фиксировали. Цель прозвучала как «сохранить деньги», а потолок по вырубке и владельцы шагов остались без ответа.","missed_quote":{"ts":"07:47","text":"Давайте не будем сейчас в это уходить, у нас сорок пять минут."},"action":"В первые три минуты следующего кейса произнести вслух: что выносим, по какому правилу выбираем и кто какую роль берёт."},{"name":"Вано","short":"Вано","good":"В обсуждении вы нашли зависимость, без которой смещение трассы было бы формальным, — полосу отвода. В финале заметили, что пункт выпал из пакета, и спросили, кто отвечает за пересмотр.","good_quote":{"ts":"12:36","text":"И параметр, который вы пропустили: полоса отвода. Если она остаётся прежней, смещение ничего не решает."},"missed":"В этой сессии ключевую информацию своей стороны вы держали до 32-й минуты — опасались, что её используют против коалиции. Этапы, владельцев и сроки в итоге вёл Дмитрий.","missed_quote":{"ts":"33:03","text":"Я держал это, потому что не хотел, чтобы это использовали как «они и так согласятся»."},"action":"В следующем кейсе выложить ограничения своей стороны в первом круге — если нужно, с условием: «Говорю при условии, что это не используют как согласие». И вести лист владельцев с первой минуты."},{"name":"Сергей","short":"Сергей","good":"Когда понадобились деньги, вы принесли их и быстро посчитали, как растянуть вклад бизнеса на шумозащиту и благоустройство. Вопросы о порядке действий задавали точные.","good_quote":{"ts":"38:14","text":"Если экраны у коммерческой зоны сокращаются на шестьсот метров, высвобождается порядка восемнадцати миллионов."},"missed":"В этой сессии 120 миллионов бизнеса и готовность девелопера прозвучали только на 31-й минуте — вы ждали, пока появится решение. Пакет команда собирала, не зная об этом ресурсе.","missed_quote":{"ts":"31:58","text":"Я ждал, пока появится решение. Деньги под разговор не дают. Вы меня спросили один раз, на шестой минуте, и приняли ответ."},"action":"В следующем кейсе — деньги и условия своей стороны на стол в первом круге. И попробовать вслух взять внедрение: «Я смотрю, как решение переживёт первые две недели»."},{"name":"Оксана","short":"Оксана","good":"В первые пять минут вы выложили закрытую информацию своей стороны, а затем перевели разговор из слов в параметры: экраны, буфер, контроль.","good_quote":{"ts":"13:25","text":"Параметры. Не слова. Экраны не меньше трёх километров, буфер не меньше сорока метров."},"missed":"В обсуждении ваши реплики чаще проверяли и критиковали решение, чем предлагали формулировку: публичную формулу на 43-й минуте предложил Михаил, вы её приняли.","missed_quote":{"ts":"43:41","text":"Формула нормальная. Первая нормальная вещь за сорок три минуты."},"action":"В следующем кейсе на каждую критику — одна встречная формулировка: «Не так. Предлагаю так: …». Черновик публичной позиции — к 20-й минуте."},{"name":"Михаил","short":"Михаил","good":"Когда цель ещё не была названа, вы развели жёсткое ограничение и цель оптимизации. На 33-й минуте за две минуты собрали в одно решение всё, что прозвучало за полчаса.","good_quote":{"ts":"07:10","text":"Давайте так: жёсткое ограничение — федеральное окно. Цель оптимизации — снизить конфликт при сохранении проекта. Это разные вещи."},"missed":"В этой сессии отложенные вопросы не возвращались в обсуждение сами: кризис с видео вы зафиксировали с пометкой «детали потом», и в план он попал только на 41-й минуте. Сборка решения началась на 33-й.","missed_quote":{"ts":"18:21","text":"Хорошо. Фиксирую пункт: кризисная коммуникация по видео. Детали потом."},"action":"В следующем кейсе каждые десять минут произносить: что решено, что отложено и когда к этому вернёмся. Отложенное — в отдельную строку листа с минутой возврата."}],"tasks":{"Дмитрий":{"1":"Открыть кейс распределением ролей: назвать свою и спросить роль у каждого до 5-й минуты","2":"Сформулировать цель одним предложением до обсуждения вариантов","3":"Не закрывать спор словом «дальше» — спросить, что из противоречия следует для даты","4":"Держать рамку плана, ведение графика отдать Организатору","5":"Задать одну схему разбора изменений в первую минуту","6":"Вести встречу по таймеру: 90 секунд на статус"},"Михаил":{"1":"Проверить матрицу: в каждой строке ровно один отвечающий","2":"Записывать карточку проекта на общем экране по ходу обсуждения","3":"Собирать противоречия в одну таблицу по мере их появления","4":"Каждые десять минут проговаривать: что решено, что отложено и когда вернёмся","5":"Для каждого отложенного вопроса назначить минуту возврата","6":"Открывать встречу проверкой решений прошлой"},"Оксана":{"1":"Назвать, кого из внешних сторон нужно согласовывать по каждому пакету","2":"На каждую критику формулировки — своя встречная формулировка","3":"Задать минимум три уточняющих вопроса другим потокам","4":"Проверить план на приемлемость для спонсора и подрядчиков","5":"Сформулировать запрос на изменение спонсору","6":"Подготовить черновик сообщения магазинам о запуске"},"Вано":{"1":"Взять роль Организатора и вести лист владельцев с первой минуты","2":"Выложить свои ограничения в первом круге","3":"Выложить статус своего потока первым","4":"Вести сетевой график: зависимости, исполнители, сроки","5":"У каждого риска — владелец и триггер","6":"Вести доску решений: действие, владелец, срок"},"Сергей":{"1":"Взять роль Реформатора и назвать её вслух","2":"Спросить команду: как результат переживёт первые две недели после запуска?","3":"Выложить закрытые факты своей карточки до 10-й минуты","4":"Проверить план на внедряемость: обучение, люди, сопротивление","5":"Оценить влияние каждого изменения на людей","6":"Назвать блокер по людям на первой встрече"}},"rules":{"1":"Роли — вслух в первые пять минут. У каждой задачи один отвечающий.","2":"Цель — одним предложением до разговора о вариантах.","3":"Первый круг — каждый выкладывает свою закрытую информацию.","4":"Один общий лист на экране. Отложенное — в лист, с минутой возврата.","5":"Любое изменение — по одной схеме: срок, деньги, объём, кто решает.","6":"Статус — 90 секунд, у каждого решения — владелец и срок. Встреча начинается с решений прошлой."},"priority":[1,3,2],"reflection":{"1":["Кто за что отвечал на деле — совпало ли это с матрицей?","Где двое считали себя главными, а где не было никого?","Чья зона осталась без ответа и почему?","Какое правило оставляем себе после этого кейса?"],"2":["Сформулирует ли каждый из пятерых цель одинаково прямо сейчас?","Какой факт о цели всплыл позже, чем был нужен?","Что мы записали как ограничение, а что — как пожелание?","Какое правило оставляем себе после этого кейса?"],"3":["Какую информацию мы узнали позже, чем она появилась у кого-то из нас?","Что мешало выложить её раньше?","Какое противоречие ушло в поиск виноватого, а не в последствия?","Какое правило оставляем себе после этого кейса?"],"4":["Кто на самом деле строил план — все или один?","Какая зависимость всплыла только после вброса?","Что мы отложили — и вернулись ли к этому?","Какое правило оставляем себе после этого кейса?"],"5":["Какое изменение мы решили сами, а какое отдали спонсору — и почему?","Чья позиция не прозвучала до решения?","Есть ли у каждого риска триггер, при котором включается мера?","Какое правило оставляем себе после этого кейса?"],"6":["Сколько времени ушло на статусы, а сколько — на решения?","Какой блокер мы нашли через вопрос к соседнему потоку?","Проверили ли мы решения прошлой встречи?","Какие правила из шести мы уже соблюдаем без напоминания?"]},"cases":[{"n":1,"title":"Роли и ответственность в проектной команде","name":"Кто за что отвечает","skill":"Определение ролей участников, зон ответственности и порядка взаимодействия. Команда учится быстро распределять задачи, понимать, кто отвечает за результат, кто участвует в выполнении и кто подключается к согласованию.","week":"неделя 1","situation":["Совет директоров утвердил проект, спонсор передал команде устав: цель, бюджет, срок и 14 пакетов работ — от договора аренды до первой отгрузки. Владельцев у пакетов нет: в уставе стоит «команда проекта».","Пятеро впервые ведут общий проект такого масштаба. Каждый пришёл из своей функции со своим представлением, кто здесь главный и кто что подписывает. Спонсор ждёт к концу недели ответ на один вопрос: кто за что отвечает."],"task":["Распределить 14 пакетов работ: у каждого — один отвечающий за результат (A) и исполнители (R)","Назвать, кого по каждому пакету нужно согласовать (C) и кого информировать (I)","Назначить руководителя проекта и роли GAME PLAN в команде","Определить порядок эскалации к спонсору и регламент синхронизации команды"],"constraints":[{"v":"14 пакетов","l":"работ в уставе, у каждого — ровно один A"},{"v":"5 млн ₽","l":"лимит подписи представителя заказчика"},{"v":"10 млн ₽","l":"платежи выше — финансовый директор и спонсор"},{"v":"45 минут","l":"на всю работу, лист сдаётся в конце"}],"deliverables":["Матрица ответственности RACI: 14 пакетов × 5 участников","Руководитель проекта и роли GAME PLAN, названные вслух","Правило эскалации: какие вопросы и с какого порога идут к спонсору","Регламент синхронизации: когда, сколько, в каком канале"],"injections":[{"at":"20:00","text":"Спонсор пишет в общий чат: «Кто у вас подписывает договор с подрядчиком по стеллажам? Поставщик держит цену до пятницы»."}],"cards":{"anna":["Спонсор сказал вам лично: ему нужна одна точка ответственности за проект, «а не пять голосов в чате».","Вы продолжаете руководить действующим складом в Твери — на проект у вас не больше половины времени.","Опыт запуска складов у вас есть, опыта запуска с нуля — нет."],"igor":["Поставщик складской системы требует одного лица, принимающего решения с вашей стороны, иначе сроки внедрения не гарантирует.","Любое подключение к сети компании согласует служба информационной безопасности — это две-три недели.","Складская система не запустится без утверждённой топологии склада — её делает не IT."],"marina":["По договору с подрядчиком нужен представитель заказчика с правом подписи до 5 млн ₽. Выше — только финансовый директор.","Поставщик стеллажей держит цену до пятницы — договор на 62 млн.","Арендодатель передаёт помещение по акту — акт подписывает тот, кто отвечает за объект."],"pavel":["Набор 120 человек нельзя начать, пока не назначен руководитель склада — ему подчиняются смены, он утверждает штатное расписание.","Руководителя склада в проекте нет, и в уставе он не упомянут.","Профсоюз региона требует уведомления о новых рабочих местах за два месяца."],"elena":["Бюджетом владеет финансовая дирекция, а не проект: каждый платёж выше 10 млн ₽ согласуют финансовый директор и спонсор.","Резерв 40 млн может тратить только спонсор.","Платёжный календарь закрывается 25-го числа — всё, что не попало, уходит на следующий месяц."]},"checklist":["У каждого из 14 пакетов ровно один отвечающий за результат (A)","Нет пакета без исполнителя (R)","Руководитель проекта назначен и подтверждён командой","Учтены права подписи: 5 млн у представителя заказчика, выше — финансовый директор","Согласующие по информационной безопасности и финансам названы","Правило эскалации к спонсору с порогом по деньгам и срокам","Выявлен пробел: руководитель склада не назначен, набор персонала заблокирован","Роли GAME PLAN распределены и названы вслух","Регламент синхронизации: день, длительность, канал","Нагрузка руководителя проекта учтена: не больше пяти пакетов с его A"],"focus":{"name":"Распределение ответственности","criteria":["однозначность: один A на пакет","покрытие: у каждого пакета есть исполнитель","согласования и права подписи учтены","роли распределены до работы по существу"]},"sheet":{"title":"Лист 1 · Матрица ответственности","hint":"Клик по клетке переключает R → A → C → I → пусто. В каждой строке — ровно о /* лист задания — пустой бланк команды */
const CYCLE=["","R","A","C","I"];
function renderSheet(p,c){
  const S=c.sheet, w=el("div","sheet");
  w.appendChild(el("div","sheet-h",'<div><div class="t">'+esc(S.title)+'</div><div class="s">'+esc(S.hint)+'</div></div>'+
    '<div class="w">Кейс '+c.n+' · РЦ «Северный»<br>Дата: ____________</div>'));
  S.blocks.forEach(b=>{
    const blk=el("div","blk");
    if(b.type==="raci"){
      blk.appendChild(el("div","blk-t","Пакеты работ × участники"));
      const sc=el("div","tscroll"), t=el("table","sh raci");
      t.innerHTML='<tr><th>Пакет работ</th>'+D.team.map(m=>'<th class="m">'+esc(m.short)+'</th>').join("")+'</tr>';
      b.rows.forEach((r,i)=>{
        const tr=el("tr",null,'<td class="pre">'+(i+1)+". "+esc(r)+'</td>');
        D.team.forEach(()=>{const cd=el("td","c"); cd.dataset.v="";
          cd.onclick=()=>{const nv=CYCLE[(CYCLE.indexOf(cd.dataset.v)+1)%CYCLE.length]; cd.dataset.v=nv; cd.textContent=nv; cd.className="c"+(nv?" "+nv:"");
            const cs=[...tr.querySelectorAll("td.c")]; tr.classList.toggle("bad", cs.some(x=>x.dataset.v)&&cs.filter(x=>x.dataset.v==="A").length!==1);};
          tr.appendChild(cd);});
        t.appendChild(tr);
      });
      sc.appendChild(t); blk.appendChild(sc);
      blk.appendChild(el("div","raci-leg",'<span><b style="background:var(--blue-50);color:var(--blue)">R</b>исполняет</span><span><b style="background:var(--blue);color:#fff">A</b>отвечает за результат</span>'+
        '<span><b style="background:var(--warn-50);color:var(--warn)">C</b>согласует</span><span><b style="background:var(--soft);color:var(--muted)">I</b>информируется</span>'));
    }else if(b.type==="fields"){
      b.items.forEach(([lb,hint,lines])=>{
        const f=el("div","fld",'<div class="lb">'+esc(lb)+'<small>'+esc(hint)+'</small></div>');
        const inp=el("div","in"); inp.contentEditable="true"; inp.style.minHeight=(36+35*(lines-1))+"px"; f.appendChild(inp); blk.appendChild(f);
      });
    }else{
      blk.appendChild(el("div","blk-t",esc(b.title)));
      const sc=el("div","tscroll"), t=el("table","sh");
      t.innerHTML="<tr>"+b.cols.map(x=>"<th>"+esc(x)+"</th>").join("")+"</tr>";
      (b.rows||Array.from({length:b.n},()=>[])).forEach(pre=>{
        const tr=el("tr");
        b.cols.forEach((cn,ci)=>{ if(ci<pre.length) tr.appendChild(el("td",cn==="№"?"pre num":"pre",esc(pre[ci])));
          else {const td=el("td"); td.contentEditable="true"; tr.appendChild(td);} });
        t.appendChild(tr);
      });
      sc.appendChild(t); blk.appendChild(sc);
    }
    w.appendChild(blk);
  });
  p.appendChild(w);
  const a=el("div","actions",'<button class="btn btn-ghost btn-sm" id="clr">Очистить лист</button><button class="btn btn-ghost btn-sm" id="prn">Распечатать</button>'+

}

  '<div class="grid2"><div class="card soft"><div class="lab">Первая диагностика</div><div class="h3">'+esc(D.diag.title)+'</div>'+
    '<p style="font-size:14px;color:var(--muted)">Роли не распределены, команда впервые работает вместе.</p></div>'+
  '<div class="card" style="border-color:var(--blue)"><div class="lab" style="color:var(--blue)">Повторная диагностика</div><div class="h3">'+esc(A.title)+'</div>'+
    '<p style="font-size:14px;color:var(--muted)">'+esc(A.summary)+'</p></div></div>'+
  '<div class="card gap" id="cmp"></div>'+
  '<div class="card gap" style="background:var(--blue-50);border-color:transparent"><div class="h3">Следующий цикл</div>'+
    '<p style="margin-bottom:14px">'+esc(D.next.text)+'</p><div style="display:flex;gap:8px;flex-wrap:wrap">'+D.next.cases.map(caseChip).join("")+'</div></div>'+
  nextBtns(5);
  const w=v.querySelector("#cmp");
  D.compare.forEach(x=>{
    w.appendChild(el("div","cmp",'<div class="t">'+esc(x.title)+'<div><span class="vd '+x.verdict+'">'+(x.verdict==="up"?"сдвиг есть":"сдвиг есть, зона роста")+'</span></div></div>'+
      '<div class="side b"><div class="k">До программы</div><div class="v">'+esc(x.b_val)+'</div><div class="l">'+esc(x.before)+'</div></div>'+
      '<div class="arr">→</div>'+
      '<div class="side a"><div class="k">После программы</div><div class="v">'+esc(x.a_val)+'</div><div class="l">'+esc(x.after)+'</div></div>'+
      (x.quote?'<div class="quote" style="grid-column:2/-1"><div class="qwho">'+photo(x.quote[1],"sm")+'<span class="ts">'+esc(x.quote[0])+'</span> '+esc(x.quote[1])+'</div>«'+esc(x.quote[2])+'»</div>':"")+
      (x.note?'<div class="note">'+esc(x.note)+'</div>':"")));
  });
}

go(1);
})();
</script>
</body>
</html>
